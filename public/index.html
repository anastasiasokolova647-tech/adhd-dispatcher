<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Час для себе</title>
  <link rel="stylesheet" href="style.css?v=5">  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f3b8c4">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
  <link rel="shortcut icon" type="image/png" href="/icon-192.png?v=2">
  <link rel="apple-touch-icon" href="/icon-192.png?v=2">
</head>
<body>
<h1>🧠 Час для себе</h1>
  <p>Не тримай усе в голові. Давай залишимо це тут.</p>

  <nav>
    <button onclick="showInbox()">🧠 Вивантажити з голови</button>
    <button onclick="showToday()">☀️ Сьогодні</button>
    <button onclick="showWeek()">🗓 Тиждень</button>
    <button onclick="showCalendar()">📅 Календар</button>
    <button onclick="showFolders()">📁 Папки</button>
    <button id="bookQueueNav" onclick="showBookQueue()">📚 Книжкова черга</button>
    <button onclick="showCalmCorner()">🕯️ Закуток спокою</button>
  </nav>

  <section id="anchorPhrase">
    <div>
      <strong>🌸 Фраза, що тримає</strong>
      <button onclick="editAnchorPhrase()" title="Змінити фразу">✏️</button>
    </div>
    <p id="anchorPhraseText">Торкнись ✏️ і залиш собі фразу на сьогодні</p>
  </section>

  <main>
    <h2>Що зараз крутиться в голові?</h2>
    <textarea id="homeInboxText" placeholder="Розкажи мені. Я хочу це почути…"></textarea>
    <br>
    <button id="homeSaveInbox" type="button">Зберегти</button>
  </main>

  <script src="app.js?v=14"></script>
  <script>
    if ("serviceWorker" in navigator) {
      const host = window.location.hostname;
      const parts = host.split(".").map(Number);
      const isPrivateLan =
        host === "localhost" ||
        host === "127.0.0.1" ||
        (parts.length === 4 &&
          parts.every(Number.isInteger) &&
          (
            parts[0] === 10 ||
            (parts[0] === 192 && parts[1] === 168) ||
            (parts[0] === 172 && parts[1] >= 16 && parts[1] <= 31)
          ));

      if (isPrivateLan) {
        navigator.serviceWorker.getRegistrations()
          .then((regs) => regs.forEach((reg) => reg.unregister()))
          .catch(() => {});

        if ("caches" in window) {
          caches.keys()
            .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
            .catch(() => {});
        }
      } else {
        navigator.serviceWorker.register("/sw.js");
      }
    }
  </script>
</body>
</html>
